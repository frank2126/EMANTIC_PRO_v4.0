[pytest]
# Configuración de pytest para EMANTIX PRO

# Directorio base de tests
testpaths = tests

# Archivos de prueba
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Opciones de ejecución
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers personalizados
markers =
    auth: Tests de autenticación
    security: Tests de seguridad
    database: Tests de base de datos
    endpoint: Tests de endpoints
    validation: Tests de validación
    error: Tests de manejo de errores
    slow: Tests lentos

# Opciones de cobertura (si se usa pytest-cov)
# --cov=.
# --cov-report=html
# --cov-report=term-missing
