version: '3.8'

services:
  # Backend API
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: emantic-api
    ports:
      - "8000:8000"
    environment:
      - DB_SERVER=host.docker.internal
      - DB_NAME=EmantixDB
      - DB_USER=sa
      - DB_PASSWORD=${DB_PASSWORD:-changeme}
      - DEBUG=False
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
    depends_on:
      - web
    networks:
      - emantic-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Web
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: emantic-web
    ports:
      - "3000:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
    networks:
      - emantic-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: emantic-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/var/www/html:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - web
    networks:
      - emantic-network

networks:
  emantic-network:
    driver: bridge
