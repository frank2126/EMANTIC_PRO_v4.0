<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="theme-color" content="#0d5c45" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Emantic" />
    <meta name="description" content="Emantic Pro" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Emantic Pro</title>

    <!-- Pantalla de carga: se muestra antes de que Vue arranque -->
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px;
        background: linear-gradient(160deg, #094535 0%, #0d6b4f 100%);
        transition: opacity .35s ease;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash img {
        width: 84px; height: 84px; border-radius: 18px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, .3);
        animation: sp-pulse 1.6s ease-in-out infinite;
      }
      #splash .sp-name {
        color: #fff; font: 800 22px/1 Inter, Arial, sans-serif; letter-spacing: 4px;
      }
      #splash .sp-bar {
        width: 160px; height: 3px; border-radius: 3px;
        background: rgba(255, 255, 255, .18); overflow: hidden;
      }
      #splash .sp-bar i {
        display: block; height: 100%; width: 40%;
        background: #31b079; border-radius: 3px;
        animation: sp-slide 1.1s ease-in-out infinite;
      }
      @keyframes sp-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
      @keyframes sp-pulse { 50% { transform: scale(1.05); } }
      @media (prefers-reduced-motion: reduce) {
        #splash img, #splash .sp-bar i { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="splash" role="status" aria-live="polite" aria-label="Cargando EMANTIC">
      <img src="/icons/icon-192.png" alt="" />
      <div class="sp-name">EMANTIC</div>
      <div class="sp-bar"><i></i></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
